name: BounceQuest image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "deploy/bouncequest/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bouncequest-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mc-enterprises/bouncequest-rentals:latest
            ghcr.io/mc-enterprises/bouncequest-rentals:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=bq-web
          cache-to: type=gha,mode=max,scope=bq-web
